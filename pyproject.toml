[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ugoku"
version = "0.1.0"
description = "Fully automatic moving-manga pipeline: page images in, playable moving manga out"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "onnxruntime>=1.17",
  "pillow>=10",
  "requests>=2.31",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "ruff>=0.5", "pyyaml>=6", "httpx>=0.27", "playwright>=1.44", "fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]

[project.scripts]
ugoku = "ugoku.cli:main"

[tool.setuptools.packages.find]
include = ["ugoku*"]

[tool.setuptools.package-data]
ugoku = ["web/player/*", "web/ui/*", "schema/*.json", "pipeline/direction/prompts/*.md"]

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E701", "E702", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not e2e'"
markers = ["e2e: browser end-to-end tests (pytest -m e2e)"]

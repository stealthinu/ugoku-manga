name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      UGOKU_MODEL_DIR: ${{ github.workspace }}/.models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip, cache-dependency-path: pyproject.toml }
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - name: detector models (cached; only ctd and bubble, both optional user downloads, never committed)
        uses: actions/cache@v4
        with: { path: .models, key: "models-${{ hashFiles('ugoku/models.py') }}" }
      - run: ugoku models fetch ctd bubble
      - run: pytest -q

  e2e:
    runs-on: ubuntu-latest
    needs: test
    env:
      UGOKU_MODEL_DIR: ${{ github.workspace }}/.models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pyproject.toml }
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install -e ".[dev]"
      - uses: actions/cache@v4
        with: { path: .models, key: "models-${{ hashFiles('ugoku/models.py') }}" }
      - run: ugoku models fetch ctd bubble
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q -m e2e tests/e2e

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: deny-grep (generic patterns; private terms come from the optional UGOKU_DENY_PATTERNS secret)
        env: { UGOKU_DENY_PATTERNS: "${{ secrets.UGOKU_DENY_PATTERNS }}" }
        run: bash scripts/deny_grep.sh --history
      - run: python scripts/check_repo.py
      - name: gitleaks (MIT CLI binary, checksum pinned; not the licensed action)
        run: |
          curl -sSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks
          ./gitleaks git --redact -c .gitleaks.toml .
